<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Kale</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden; /* Allow vertical scroll for footer */
      }

      body {
        background-color: #8BA637;
        font-family: 'Patrick Hand', cursive;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between; /* Pushes footer to the bottom */
        color: #F2F2F2;
        min-height: 100vh;
      }

      .container {
        text-align: center;
        padding: 20px;
        padding-top: 25vh;
        box-sizing: border-box;
      }

      .logo {
        font-size: min(120px, 15vh);
      }

      .subtitle {
        font-size: min(32px, 4vh);
        margin-bottom: min(60px, 8vh);
        color: #F2F2F2;
      }

      .store-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
      }

      .store-button {
        background-color: #F2F2F2;
        color: #8BA637;
        padding: 15px 30px;
        border-radius: 25px;
        text-decoration: none;
        font-size: min(24px, 3vh);
        transition: transform 0.2s;
      }

      .store-button:hover {
        transform: translateY(-2px);
      }

      .footer {
        width: 100%;
        padding: 20px 0;
        text-align: center;
      }
      
      .footer a {
        color: #CADE81;
        text-decoration: none;
        margin: 0 15px;
        font-size: 16px;
      }
      
      .footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 600px) {
        .logo {
          font-size: min(80px, 12vh);
        }
        .subtitle {
          font-size: min(24px, 3vh);
        }
        .store-buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">KALE</div>
      <div class="subtitle">Instagram without the cocaine.</div>
      <!--
      <div class="store-buttons">
        <a href="#" class="store-button">App Store</a>
        <a href="#" class="store-button">Google Play</a>
      </div>
      -->
    </div>
    <footer class="footer">
        <a href="./privacy.html">Privacy Policy</a>
        <a href="./terms.html">Terms & Conditions</a>
    </footer>
  </body>
</html>
